server:
  port: 8080

spring:
  application:
    name: archeon-backend
  datasource:
    # Defaults to in-memory PostgreSQL-mode H2 for instant local runtime, seamlessly overridden by SPRING_DATASOURCE_URL
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:archeon_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  legal:
    brand-name: "ArcheOn Design Studio"
    business-display-name: "MB's ArcheOn Design Studio"
    principal: "Ar. Mandar Bhalekar"
    social-handle: "@mbs_archeon_ds"
    office-address: "1st Floor, Krishna-Kunj, 90, Dharempeth Layout, opposite Aaji Aajoba Park, Deendayal Nagar, Nagpur, Maharashtra 440022, India."
    maps-url: "https://maps.app.goo.gl/wLidaC62gQLccoNY8"
    legal-entity-name: "PENDING BUSINESS CONFIRMATION"
    official-office-address: "1st Floor, Krishna-Kunj, 90, Dharempeth Layout, opposite Aaji Aajoba Park, Deendayal Nagar, Nagpur, Maharashtra 440022, India."
    gstin: "PENDING BUSINESS CONFIRMATION"

  approval:
    high-value-threshold: 100000.00
    currency: "INR"
    status: "PROVISIONAL (PENDING BUSINESS APPROVAL)"
    split-prevention-window-hours: 48

  whatsapp:
    enabled: false
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:PENDING_CONFIRMATION}
    access-token: ${WHATSAPP_ACCESS_TOKEN:PENDING_CONFIRMATION}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:PENDING_CONFIRMATION}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:PENDING_CONFIRMATION}
    reminder-interval-days: 3
    quiet-hours-start: 21
    quiet-hours-end: 9
    max-reminders-cap: 5

  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
    issuer: "archeon-api"
    audience: "archeon-web"

  security:
    revocation-strategy: ${APP_SECURITY_REVOCATION_STRATEGY:in-memory}
    encryption:
      secret-key: ${APP_ENCRYPTION_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}

  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"

  portal:
    base-url: ${APP_PORTAL_BASE_URL:http://localhost:3000}

  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    provider: ${APP_MAIL_PROVIDER:mock} # 'smtp' for live authenticated SMTP, 'mock' for in-memory deterministic test capture
    from-address: ${APP_MAIL_FROM_ADDRESS:invitations@archeon.design}
    from-name: ${APP_MAIL_FROM_NAME:ArcheOn Design Studio}
    reply-to: ${APP_MAIL_REPLY_TO:support@archeon.design}
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
    starttls: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
    connection-timeout-ms: ${APP_MAIL_CONNECTION_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_MAIL_READ_TIMEOUT_MS:10000}

  storage:
    provider: ${APP_STORAGE_PROVIDER:LOCAL_PRIVATE}
    local:
      base-dir: ${APP_STORAGE_LOCAL_BASE_DIR:./storage/private}
    max-file-size-mb: ${APP_STORAGE_MAX_FILE_SIZE_MB:25}

  dms:
    malware-scan-mode: ${APP_DMS_MALWARE_SCAN_MODE:DETERMINISTIC_MOCK}
    clamav:
      host: ${APP_DMS_CLAMAV_HOST:localhost}
      port: ${APP_DMS_CLAMAV_PORT:3310}
      connection-timeout-ms: ${APP_DMS_CLAMAV_CONNECTION_TIMEOUT_MS:3000}
      read-timeout-ms: ${APP_DMS_CLAMAV_READ_TIMEOUT_MS:10000}

